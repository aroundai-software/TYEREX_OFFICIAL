name: Autofix
description: AutoFix vehicle management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.4.2
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^6.2.1
  archive: ^3.4.10
  share_plus: ^7.2.1
  audioplayers: ^6.5.1

  # Media
  image_picker: ^1.0.7
  record: ^6.0.0

  # Date formatting & URL launching
  intl: ^0.20.2
  url_launcher: ^6.2.5
  permission_handler: ^12.0.1

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.11.1

  # Google Sign-In & Drive
  googleapis: ^15.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.5.0

  # Data Table & CSV
  data_table_2: ^2.6.0
  csv: ^6.0.0
  universal_html: ^2.2.4

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Notifications
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3

  # Connectivity
  connectivity_plus: ^7.0.0

  # Caching
  cached_network_image: ^3.3.1
  path: ^1.9.1
  flutter_local_notifications: ^19.4.2

  # Animations & UI Enhancements
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  flutter_slidable: ^3.0.1
  font_awesome_flutter: ^11.0.0
  
  # Security & Auth
  local_auth: ^2.2.0
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  uuid: ^4.5.2


  cross_file: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

  autofix_app: any
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png      # ✅ Add explicit reference
    - assets/images/car_outline.png
    

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/static/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope/static/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/static/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/static/Manrope-ExtraBold.ttf
          weight: 800
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_logo.png"